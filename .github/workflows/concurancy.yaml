name: concurancy workflow
on:
  push:
    branches:
      - master
concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5 
    steps:
      - name: builiding image 
        run: |
          echo "Building image"
          sleep 10
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: deploying image
        run: |
          echo "deploying image"
          sleep 10
