apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: ci
  namespace: argo-events
spec:
  service:
    ports:
      - port: 12000
        targetPort: 12000
  github:
    push-event:
      webhook:
        port: "12000"
        endpoint: /push
        method: POST
      # The repository details
      owner: "pullapantangi"
      repositories:
        - name: "versioned_app_test"
      events:
        - push
      # Secret for payload verification
      webhookSecret:
        name: github-webhook-secret
        key: secret
      apiToken:
        name: github-access-token # Secret containing your PAT
        key: token
